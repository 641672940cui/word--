// ============================================================
// 渲染
// ============================================================
const container = document.getElementById('passageContainer');
const tabBar = document.getElementById('tabBar');

// 生成Tab按钮
passagesData.forEach((p, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
  btn.dataset.tab = idx;
  btn.innerHTML = `${p.title} <span class="badge-sm">${p.badge}</span>`;
  tabBar.appendChild(btn);
});

function renderPassage(index) {
  const p = passagesData[index];
  const idx = index;
  let html = `<div class="passage-card active" data-idx="${idx}">`;

  html += `<div class="passage-title"><span>${p.title}</span><span class="badge">${p.badge}</span></div>`;
  html += `<div class="passage-text">${p.text}</div>`;
  html += `<div class="highlight-words">${p.vocab}</div>`;

  // 阅读理解 Q1-Q4
  html += `<div class="question-block">`;
  p.questions.forEach((item, qi) => {
    const qNum = qi + 1;
    html += `<div class="q-item" data-q="${qNum}">`;
    html += `<div class="q-label">${qNum}.</div> ${item.q}`;
    html += `<div class="options">`;
    item.options.forEach((opt, oi) => {
      html += `<label class="opt-label"><input type="radio" name="q${idx}_${qNum}" value="${oi}"> ${opt}</label>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  // 长难句 (Q5-Q6)
  const ls = p.longSentence;
  html += `<div class="grammar-section">`;
  html += `<div class="sec-title"><span>📐 长难句结构 · 选择题</span><span class="tag">主句 + 从句</span></div>`;
  html += `<div class="sentence-display">${ls.display}</div>`;
  html += `<div class="q-item" data-q="5">`;
  html += `<div class="q-label">5.</div> ${ls.q1.q}`;
  html += `<div class="options">`;
  ls.q1.options.forEach((opt, oi) => {
    html += `<label class="opt-label"><input type="radio" name="q${idx}_5" value="${oi}"> ${opt}</label>`;
  });
  html += `</div></div>`;
  html += `<div class="q-item" data-q="6">`;
  html += `<div class="q-label">6.</div> ${ls.q2.q}`;
  html += `<div class="options">`;
  ls.q2.options.forEach((opt, oi) => {
    html += `<label class="opt-label"><input type="radio" name="q${idx}_6" value="${oi}"> ${opt}</label>`;
  });
  html += `</div></div>`;
  html += `<div class="analysis-box">${ls.analysis}</div>`;
  html += `</div>`;

  // 语法 Q7
  const g = p.grammar;
  html += `<div class="grammar-section" style="border-left-color: #b16a3a;">`;
  html += `<div class="sec-title"><span>⚡ 语法点 · 单选题</span><span class="tag">语法</span></div>`;
  html += `<div class="q-item" data-q="7">`;
  html += `<div class="q-label">7.</div> ${g.q}`;
  html += `<div class="options">`;
  g.options.forEach((opt, oi) => {
    html += `<label class="opt-label"><input type="radio" name="q${idx}_7" value="${oi}"> ${opt}</label>`;
  });
  html += `</div></div>`;
  html += `<div class="analysis-box" style="border-left-color: #b16a3a;">${g.analysis}</div>`;
  html += `</div>`;

  // 提交 & 重置
  html += `<div class="submit-area">`;
  html += `<button class="btn" onclick="submitPassage(${idx})">📝 提交批改</button>`;
  html += `<button class="btn btn-reset" onclick="resetPassage(${idx})">🔄 重选</button>`;
  html += `</div>`;

  html += `<div class="result-box" id="result_${idx}">`;
  html += `<div class="result-grid" id="resultGrid_${idx}"></div>`;
  html += `<div class="explain-text" id="explainText_${idx}"></div>`;
  html += `</div>`;

  html += `</div>`;
  return html;
}

// 渲染全部卡片
function renderAll() {
  let allHtml = '';
  passagesData.forEach((p, i) => {
    allHtml += renderPassage(i);
  });
  container.innerHTML = allHtml;
  // 默认只显示第一篇
  showTab(0);
}
renderAll();

// ============================================================
// Tab 切换
// ============================================================
const tabBtns = document.querySelectorAll('.tab-btn');
tabBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    const idx = parseInt(this.dataset.tab);
    showTab(idx);
  });
});

function showTab(idx) {
  // 更新按钮
  const btns = document.querySelectorAll('.tab-btn');
  btns.forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
  // 更新卡片
  const cards = document.querySelectorAll('.passage-card');
  cards.forEach((card, i) => {
    card.classList.toggle('active', i === idx);
  });
  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// 提交 & 批改
// ============================================================
function submitPassage(idx) {
  const p = passagesData[idx];
  const resultBox = document.getElementById(`result_${idx}`);
  const grid = document.getElementById(`resultGrid_${idx}`);
  const explain = document.getElementById(`explainText_${idx}`);

  let userAnswers = [];
  for (let qNum = 1; qNum <= 7; qNum++) {
    const name = `q${idx}_${qNum}`;
    const radios = document.querySelectorAll(`input[name="${name}"]`);
    let selected = null;
    radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });
    userAnswers.push(selected);
  }

  const correct = p.allAnswers;
  const correctIdx = correct.map(ch => ch.charCodeAt(0) - 65);
  const letters = ['A','B','C','D'];

  let gridHtml = '';
  for (let i = 0; i < 7; i++) {
    const user = userAnswers[i];
    const right = correctIdx[i];
    const isCorrect = (user === right);
    const status = (user === null) ? '⬜ 未选' : (isCorrect ? '✅ 正确' : '❌ 错误');
    const userLetter = (user !== null) ? letters[user] : '—';
    const rightLetter = letters[right];
    gridHtml += `<div class="r-item"><span class="r-label">${i+1}.</span> 你的答案: <strong>${userLetter}</strong> ${status}  | 正确答案: ${rightLetter}</div>`;
  }
  grid.innerHTML = gridHtml;
  explain.innerHTML = `📖 详细解析：${p.allExplanations}`;
  resultBox.classList.add('show');
}

// ============================================================
// 重置
// ============================================================
function resetPassage(idx) {
  const resultBox = document.getElementById(`result_${idx}`);
  resultBox.classList.remove('show');
  for (let qNum = 1; qNum <= 7; qNum++) {
    const name = `q${idx}_${qNum}`;
    const radios = document.querySelectorAll(`input[name="${name}"]`);
    radios.forEach(r => r.checked = false);
  }
}

// 点击label高亮
document.addEventListener('change', function(e) {
  if (e.target.type === 'radio') {
    const label = e.target.closest('.opt-label');
    if (label) {
      const siblings = label.parentElement.querySelectorAll('.opt-label');
      siblings.forEach(s => s.classList.remove('selected'));
      label.classList.add('selected');
    }
  }
});
</script>
</body>
</html>

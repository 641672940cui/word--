<script>

    {day:8,topic:'蜘蛛侠·家庭',words:[{word:'generation',zh:'一代人；代'},{word:'misunderstand',zh:'误解'},{word:'expectation',zh:'期望'},{word:'concern',zh:'关心；担忧'},{word:'patience',zh:'耐心'},{word:'express',zh:'表达'},{word:'listen',zh:'倾听'},{word:'compromise',zh:'妥协；折中'},{word:'forgive',zh:'原谅'},{word:'appreciate',zh:'感激；欣赏'},{word:'pressure',zh:'压力'},{word:'independence',zh:'独立'},{word:'perspective',zh:'视角；观点'},{word:'conflict',zh:'冲突'},{word:'harmony',zh:'和谐'},{word:'guide',zh:'引导'},{word:'admit',zh:'承认'},{word:'cherish',zh:'珍惜'},{word:'gradually',zh:'逐渐地'},{word:'connection',zh:'联系；纽带'}]},

const allKnownWords={};
allVocabGroups.forEach(g=>{g.words.forEach(w=>{allKnownWords[w.word]={zh:w.zh,day:g.day};});});

function genOpts(cw,groupWords){const o=groupWords.filter(w=>w.word!==cw.word);return [...o.sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.zh),cw.zh].sort(()=>Math.random()-0.5);}
const groupChoiceData=allVocabGroups.map(g=>g.words.map(w=>({word:w.word,correctZh:w.zh,options:genOpts(w,g.words)})));

const sentenceReview=[
    {source:'Day 7',en:'A friend who is loyal and honest is a treasure that cannot be replaced.',zh:'一个忠诚而诚实的朋友，是无法被替代的珍宝。',analysis:'<strong>定语从句：</strong><span class="hl-clause">who is loyal and honest</span> 修饰 friend'},
    {source:'Day 9',en:'What made the Avengers unstoppable was not their individual strength, but their trust in one another.',zh:'让复仇者联盟势不可挡的，不是个人力量，而是彼此的信任。',analysis:'<strong>主语从句：</strong><span class="hl-clause">What made the Avengers unstoppable</span>'},
    {source:'Day 10',en:'What Iron Man taught us is that being vulnerable is not a weakness — it is the first step toward growth.',zh:'钢铁侠教给我们的是，脆弱不是弱点——它是走向成长的第一步。',analysis:'<strong>主语从句+表语从句：</strong>What... taught us + that being vulnerable...'},
    {source:'Day 11',en:'Athletes who persevere through adversity are not the ones who never fall, but the ones who always rise again.',zh:'在逆境中坚持的运动员，不是从不倒下的人，而是总能重新站起来的人。',analysis:'<strong>not... but... 并列定语从句</strong>'}
];

const sentencePractice=[
    {q:'选出最佳翻译：',sentence:'A friend who is loyal and honest is a treasure that cannot be replaced.',options:['A. 一个忠诚而诚实的朋友，是无法被替代的珍宝。','B. 朋友就是忠诚和诚实。','C. 忠诚的朋友不需要诚实。','D. 朋友可以被替代。'],answer:0},
    {q:'选出最佳翻译：',sentence:'What made the Avengers unstoppable was not their individual strength, but their trust in one another.',options:['A. 让复仇者联盟势不可挡的，不是个人力量，而是彼此的信任。','B. 复仇者联盟没有力量。','C. 个人力量最重要。','D. 信任不重要。'],answer:0},
    {q:'选出最佳翻译：',sentence:'What Iron Man taught us is that being vulnerable is not a weakness — it is the first step toward growth.',options:['A. 钢铁侠教给我们的是，脆弱不是弱点——它是走向成长的第一步。','B. 脆弱就是弱点。','C. 钢铁侠没有教我们任何东西。','D. 成长不需要脆弱。'],answer:0},
    {q:'"who persevere through adversity" 修饰什么？',sentence:'Athletes who persevere through adversity are not the ones who never fall, but the ones who always rise again.',options:['A. Athletes','B. adversity','C. the ones','D. fall'],answer:0}
];

const readingText='What makes a hero? Is it <span class="new-word" data-word="strength" title="力量 (n.) · Day 5">strength</span>? Is it the ability to <span class="new-word" data-word="command" title="指挥 (v.) · Day 9">command</span> others? The stories of <span class="new-word" data-word="friendship" title="友谊 (n.) · Day 7">friendship</span> in Transformers, of family <span class="old-word" data-word="harmony" title="和谐 (n.) · Day 8">harmony</span> in Spider-Verse, of <span class="old-word" data-word="leadership" title="领导力 (n.) · Day 9">leadership</span> in Avengers, of emotional <span class="old-word" data-word="growth" title="成长 (n.) · Day 10">growth</span> in Iron Man, and of <span class="old-word" data-word="perseverance" title="坚持 (n.) · Day 11">perseverance</span> in the World Cup all point to one answer.<br><br>A true hero is someone who builds <span class="new-word" data-word="lasting" title="持久的 (adj.) · Day 7">lasting</span> <span class="new-word" data-word="bond" title="纽带 (n.) · Day 7">bonds</span> of <span class="new-word" data-word="trust" title="信任 (n.) · Day 7">trust</span>, who learns to <span class="new-word" data-word="listen" title="倾听 (v.) · Day 8">listen</span> before speaking, who can <span class="old-word" data-word="unite" title="团结 (v.) · Day 9">unite</span> a team through <span class="old-word" data-word="humility" title="谦逊 (n.) · Day 9">humility</span>, who has the <span class="old-word" data-word="courage" title="勇气 (n.) · Day 9">courage</span> to be <span class="old-word" data-word="vulnerable" title="脆弱的 (adj.) · Day 10">vulnerable</span>, and who can <span class="old-word" data-word="endure" title="坚持 (v.) · Day 11">endure</span> <span class="old-word" data-word="setback" title="挫折 (n.) · Day 11">setback</span>s without losing <span class="old-word" data-word="passion" title="热情 (n.) · Day 11">passion</span>.<br><br>From Optimus Prime\'s <span class="new-word" data-word="sacrifice" title="牺牲 (n.) · Day 7">sacrifice</span> to Miles\'s <span class="new-word" data-word="forgiveness" title="原谅 (n.) · Day 7">forgiveness</span>, from Cap\'s <span class="old-word" data-word="vision" title="愿景 (n.) · Day 9">vision</span> to Messi\'s <span class="old-word" data-word="triumph" title="胜利 (n.) · Day 11">triumph</span>, the message is clear: heroism is not about never falling. It\'s about rising every time you do — and bringing others with you. <span class="old-word" data-word="compassion" title="同情 (n.) · Day 10">Compassion</span>, <span class="old-word" data-word="discipline" title="自律 (n.) · Day 11">discipline</span>, and the <span class="old-word" data-word="determination" title="决心 (n.) · Day 11">determination</span> to <span class="old-word" data-word="persevere" title="坚持 (v.) · Day 11">persevere</span> — these are the real superpowers.';

const readingQuestions=[
    {type:'主旨大意',q:'What is the passage mainly about?',options:['A. How to become a superhero.','B. The qualities of a true hero, inspired by Week 2 themes.','C. The best Marvel movies.','D. How to win the World Cup.'],answer:1,exp:'<strong>解析：</strong>全文综合第二周五个主题，探讨真正英雄的品质。'},
    {type:'细节理解',q:'According to the passage, what are the "real superpowers"?',options:['A. Flying and super strength.','B. Compassion, discipline, and determination.','C. Money and fame.','D. Speed and agility.'],answer:1,exp:'<strong>解析：</strong>最后一句点出真正的超能力。'},
    {type:'词义猜测',q:'"triumph" means:',options:['A. failure','B. a great victory or success','C. a small setback','D. giving up'],answer:1,exp:'<strong>解析：</strong>triumph = 胜利/成功。'},
    {type:'推理判断',q:'What do all the Week 2 stories have in common?',options:['A. They all involve aliens.','B. They show that rising after failure is heroic.','C. They are all about sports.','D. They all take place in New York.'],answer:1,exp:'<strong>解析：</strong>五个主题共同传递：跌倒后站起来才是英雄。'},
    {type:'作者态度',q:'What is the writer\'s message?',options:['A. Only superheroes can be heroes.','B. Heroism is about perseverance, compassion, and bringing others with you.','C. Winning is everything.','D. Emotions are weaknesses.'],answer:1,exp:'<strong>解析：</strong>全文核心：英雄是坚持、同情和带领他人。'}
];

function speakWord(w){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.85;window.speechSynthesis.speak(u);}

let cg=0,gs=[false,false,false,false,false],ga=[new Array(20).fill(null),new Array(20).fill(null),new Array(20).fill(null),new Array(20).fill(null),new Array(20).fill(null)],gc=[0,0,0,0,0];
let ct=new Set(JSON.parse(localStorage.getItem('completed_day12')||'[]')),ra=new Array(5).fill(null),rs=false,sa2=new Array(4).fill(null),ss=false;

function sv(){localStorage.setItem('completed_day12',JSON.stringify([...ct]));}
function up(){const p=Math.round(ct.size/3*100);document.getElementById('progress-percent').textContent=p+'%';document.getElementById('progress-fill').style.width=p+'%';['choice','sentence','reading'].forEach(t=>{const b=document.getElementById('tab-btn-'+t);if(b)b.classList.toggle('completed-tab',ct.has(t));});}
function mc(t){if(!ct.has(t)){ct.add(t);sv();up();showToast('✅ '+(t==='choice'?'词义选择':t==='sentence'?'长难句':'综合阅读')+' 已完成！');}}
function showToast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);}
function switchTab(n){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));const b=document.getElementById('tab-btn-'+n),c=document.getElementById('tab-'+n);if(b)b.classList.add('active');if(c)c.classList.add('active');}

function switchGroup(g){cg=g;document.querySelectorAll('.group-btn').forEach((b,i)=>{b.classList.toggle('active',i===g);b.classList.toggle('done',gs[i]);});renderChoiceGrid();}
function renderChoiceGrid(){const c=document.getElementById('choice-grid');if(!c)return;const d=groupChoiceData[cg];c.innerHTML=d.map((cd,i)=>`<div class="choice-card" id="choice-card-${i}"><div class="word-en">${cd.word}</div><div class="word-num">#${i+1}</div><div class="choice-options">${cd.options.map((opt,j)=>`<span class="mini-opt ${ga[cg][i]===j?'chosen':''} ${gs[cg]&&opt===cd.correctZh?'right':''} ${gs[cg]&&ga[cg][i]===j&&opt!==cd.correctZh?'wrong-chosen':''}" id="mini-${i}-${j}" onclick="sm(${i},${j})" style="${gs[cg]?'pointer-events:none':''}">${opt}</span>`).join('')}</div><div class="mini-fb" id="mini-fb-${i}">${gs[cg]?(ga[cg][i]!==null&&d[i].options[ga[cg][i]]===cd.correctZh?'<span style="color:#10B981;">✅</span>':'<span style="color:#EF4444;">✅ '+cd.correctZh+'</span>'):''}</div></div>`).join('');}
function sm(ci,oi){if(gs[cg])return;document.querySelectorAll('#choice-card-'+ci+' .mini-opt').forEach(o=>o.classList.remove('chosen'));document.getElementById('mini-'+ci+'-'+oi).classList.add('chosen');ga[cg][ci]=oi;}
function checkCurrentGroup(){if(!gs[cg]&&ga[cg].includes(null)){showToast('⚠️ 请完成本组所有20题');return;}let correct=0;const d=groupChoiceData[cg];d.forEach((cd,i)=>{const oi=ga[cg][i];if(oi===null)return;if(d[i].options[oi]===cd.correctZh)correct++;});gc[cg]=correct;gs[cg]=true;document.querySelectorAll('.group-btn').forEach((b,i)=>{b.classList.toggle('done',gs[i]);});renderChoiceGrid();showToast('Day '+(cg+7)+' 组：'+correct+'/20');updateReport();}
function resetCurrentGroup(){gs[cg]=false;ga[cg]=new Array(20).fill(null);gc[cg]=0;document.querySelectorAll('.group-btn').forEach((b,i)=>{b.classList.toggle('done',gs[i]);});renderChoiceGrid();document.getElementById('choice-report').style.display='none';}
function checkAllGroups(){for(let g=0;g<5;g++){if(!gs[g]){cg=g;switchGroup(g);checkCurrentGroup();}}setTimeout(()=>{if(gs.every(s=>s))updateReport();},500);}
function updateReport(){if(!gs.every(s=>s))return;const total=gc.reduce((a,b)=>a+b,0);const score=Math.round(total/100*100);const r=document.getElementById('choice-report');r.style.display='block';r.innerHTML=`<div class="report-big">${total}/100</div><div class="report-msg">${score>=90?'🏆 太棒了！第二周词汇掌握得非常好！':score>=70?'💪 很不错！继续巩固，下周更强！':'📚 还有提升空间，重点复习低分Day吧！'}</div><div style="font-size:0.9rem;color:var(--text-secondary);">各组正确率：${gc.map((c,i)=>'Day'+(i+7)+': '+c+'/20').join(' · ')}</div>`;if(score>=70)mc('choice');}

function rse(){const c=document.getElementById('sentence-content');if(!c)return;let h='<h3 style="margin-bottom:12px;">📖 句子解析回顾</h3>';sentenceReview.forEach(s=>{h+=`<div class="sentence-box"><div class="sentence-en">${s.en}</div><div class="sentence-zh">${s.zh}</div><span style="font-size:0.75rem;color:var(--text-secondary);">来源：${s.source}</span></div><div class="analysis-box">${s.analysis}</div><br>`;});h+='<h3 style="margin:24px 0 12px;">✏️ 翻译练习</h3>';sentencePractice.forEach((p,pi)=>{h+=`<div class="quiz-item" id="sentence-item-${pi}"><div class="quiz-stem">${pi+1}. ${p.q}</div><div class="sentence-box" style="margin:8px 0;"><div class="sentence-en">${p.sentence}</div></div><div class="quiz-options">${p.options.map((opt,j)=>`<div class="quiz-option" id="sentence-opt-${pi}-${j}" onclick="ss2(${pi},${j})"><span class="quiz-radio">${String.fromCharCode(65+j)}</span><span>${opt.substring(3)}</span></div>`).join('')}</div><div class="quiz-feedback" id="sentence-fb-${pi}"></div></div>`;});h+='<div style="margin-top:12px;"><button class="btn btn-primary" onclick="cse()">✅ 检查练习</button> <button class="btn btn-secondary" onclick="rse2()">🔄 重新作答</button></div>';c.innerHTML=h;sa2=new Array(4).fill(null);ss=false;}
function ss2(qi,oi){if(ss)return;document.querySelectorAll('#sentence-item-'+qi+' .quiz-option').forEach(o=>o.classList.remove('selected'));document.getElementById('sentence-opt-'+qi+'-'+oi).classList.add('selected');sa2[qi]=oi;}
function cse(){if(!ss&&sa2.includes(null)){showToast('⚠️ 请完成所有练习');return;}let correct=0;sentencePractice.forEach((p,i)=>{const fb=document.getElementById('sentence-fb-'+i);document.querySelectorAll('#sentence-item-'+i+' .quiz-option').forEach((o,j)=>{o.classList.add('disabled');if(j===p.answer)o.classList.add('correct');if(j===sa2[i]&&j!==p.answer)o.classList.add('wrong');});if(sa2[i]===p.answer){correct++;fb.className='quiz-feedback ok show';fb.innerHTML='✅ 正确！';}else{fb.className='quiz-feedback err show';fb.innerHTML='❌ 正确答案是 '+String.fromCharCode(65+p.answer);}});ss=true;showToast(correct+'/4 正确 · '+(correct===4?'🏆 完美！':'💪 查看解析'));if(correct>=3)mc('sentence');}
function rse2(){sa2=new Array(4).fill(null);ss=false;document.querySelectorAll('#sentence-content .quiz-option').forEach(o=>o.classList.remove('selected','correct','wrong','disabled'));document.querySelectorAll('#sentence-content .quiz-feedback').forEach(f=>{f.className='quiz-feedback';f.innerHTML='';});}

function swt(w){const info=allKnownWords[w];if(!info)return;const days=['','Day 1-6','Day 7','Day 8','Day 9','Day 10','Day 11'];const t=document.getElementById('word-tooltip');const isNew=info.day<=8;t.innerHTML='<span class="tip-word">'+w+'</span> <span class="tip-zh">'+info.zh+'</span> <span class="tip-from">📚 '+days[info.day]||'Day '+info.day+'</span>';t.classList.add('show');}
function rr(){const p=document.getElementById('reading-passage'),q=document.getElementById('reading-questions');if(!p||!q)return;p.innerHTML=readingText;p.querySelectorAll('.new-word,.old-word').forEach(el=>{el.addEventListener('click',function(e){e.stopPropagation();const w=this.getAttribute('data-word');if(w)swt(w);});});p.addEventListener('click',function(){document.getElementById('word-tooltip').classList.remove('show');});q.innerHTML=readingQuestions.map((r,i)=>`<div class="quiz-item" id="reading-item-${i}"><div class="quiz-stem"><span style="color:var(--primary);font-weight:600;">Q${i+1}.</span><span style="font-size:0.7rem;color:var(--text-secondary);background:#F3F4F6;padding:2px 8px;border-radius:10px;margin:0 6px;">${r.type}</span>${r.q}</div><div class="quiz-options">${r.options.map((opt,j)=>`<div class="quiz-option" id="reading-opt-${i}-${j}" onclick="sr(${i},${j})"><span class="quiz-radio">${String.fromCharCode(65+j)}</span><span>${opt.substring(3)}</span></div>`).join('')}</div><div class="quiz-feedback" id="reading-fb-${i}"></div></div>`).join('');ra=new Array(5).fill(null);rs=false;}
function sr(qi,oi){if(rs)return;document.querySelectorAll('#reading-item-'+qi+' .quiz-option').forEach(o=>o.classList.remove('selected'));document.getElementById('reading-opt-'+qi+'-'+oi).classList.add('selected');ra[qi]=oi;}
function car(){if(!rs&&ra.includes(null)){showToast('⚠️ 请完成所有题目');return;}let correct=0;readingQuestions.forEach((r,i)=>{const fb=document.getElementById('reading-fb-'+i);document.querySelectorAll('#reading-item-'+i+' .quiz-option').forEach((o,j)=>{o.classList.add('disabled');if(j===r.answer)o.classList.add('correct');if(j===ra[i]&&j!==r.answer)o.classList.add('wrong');});if(ra[i]===r.answer){correct++;fb.className='quiz-feedback ok show';fb.innerHTML='✅ '+r.exp;}else{fb.className='quiz-feedback err show';fb.innerHTML='❌ '+r.exp;}});rs=true;showToast(correct+'/5 正确 · '+(correct>=4?'🏆 阅读理解很棒！':'💪 查看解析'));if(correct>=4)mc('reading');}
function rar(){ra=new Array(5).fill(null);rs=false;document.querySelectorAll('#reading-questions .quiz-option').forEach(o=>o.classList.remove('selected','correct','wrong','disabled'));document.querySelectorAll('#reading-questions .quiz-feedback').forEach(f=>{f.className='quiz-feedback';f.innerHTML='';});}

function init(){renderChoiceGrid();rse();rr();up();}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>

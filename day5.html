2:[{q:'"<b>graduate</b> from high school" 中 graduate 的意思是？',opts:['入学','毕业','逃学','转学'],ans:1},{q:'"an <b>opportunity</b> to grow stronger" 中 opportunity 的意思是？',opts:['问题','机会','困难','借口'],ans:1},{q:'"The whole high school <b>experience</b>" 中 experience 的意思是？',opts:['考试','经历','课本','老师'],ans:1},{q:'"<b>develop</b> skills" 中 develop 的意思是？',opts:['忽略','发展培养','破坏','隐藏'],ans:1},{q:'"Communication is a <b>skill</b>" 中 skill 的意思是？',opts:['天赋','技能','问题','任务'],ans:1},{q:'"Hard work often beats <b>talent</b>" 中 talent 的意思是？',opts:['努力','运气','天赋','金钱'],ans:2},{q:'"be <b>responsible</b> for your decisions" 中 responsible 的意思是？',opts:['逃避的','负责的','恐惧的','自由的'],ans:1},{q:'"learn to be <b>independent</b>" 中 independent 的意思是？',opts:['依赖的','独立的','懒惰的','困惑的'],ans:1},{q:'"a <b>balance</b> between study and rest" 中 balance 的意思是？',opts:['冲突','平衡','选择','问题'],ans:1},{q:'"Set a clear <b>goal</b> for each week" 中 goal 的意思是？',opts:['目标','规则','奖励','惩罚'],ans:0}]};
const psg=`
<p>Looking back on my first term, what I value most is not any single test <span class="hl-d1">score</span> but the <span class="hl">relationships</span> I built and the <span class="hl">experience</span> I gained. When our class decided to <span class="hl">organize</span> a cultural festival, I learned what it truly means to <span class="hl">cooperate</span>. Everyone had different <span class="hl">talents</span> and <span class="hl">skills</span>, and our job was to bring them together rather than <span class="hl">compete</span> against one another. A good leader must be <span class="hl">responsible</span> yet open to feedback—a <span class="hl">balance</span> that takes practice to <span class="hl">develop</span>.</p>
<p>I was lucky to <span class="hl">attend</span> a talk by a former student who <span class="hl">graduated</span> years ago and went on to become a doctor. Her story <span class="hl">inspired</span> everyone in the room. She spoke honestly about the <span class="hl-d2">pressure</span> she faced and the people who <span class="hl">encouraged</span> her when she wanted to give up. "The friends who <span class="hl">support</span> you through hard times are the ones who truly <span class="hl">influence</span> your life," she said. I couldn't agree more. The classmates I <span class="hl">admire</span> most are not always the top scorers but those who lift others up.</p>
<p>As we grow more <span class="hl">independent</span>, we begin to understand that every choice has consequences. Whether you use your free period to <span class="hl-d1">revise</span> or scroll through your phone is a decision only you can make. Setting a clear <span class="hl">goal</span> for each day helps you stay on track. And when an <span class="hl">opportunity</span> presents itself—a competition, a leadership role, a chance to speak—take it. These moments <span class="hl-d1">prepare</span> you for the bigger challenges ahead.</p>
<p>High school is not just about <span class="hl-d2">achieving</span> high grades. It's about learning who you are and who you want to become. The <span class="hl-d2">effort</span> you put in, the <span class="hl-d2">patience</span> you show, and the courage you <span class="hl-d2">develop</span> along the way will shape your future far more than any exam <span class="hl-d1">score</span> ever could.</p>`;
const rq=[
{q:'What does the writer value most about the first term?',opts:['Test scores','Relationships and experience','Awards and prizes','Homework completion'],ans:1},
{q:'What did the former student talk about in her speech?',opts:['How to get high scores','The pressure she faced and the people who supported her','How to avoid competition','The importance of talent over effort'],ans:1},
{q:'According to the passage, what kind of classmates does the writer admire most?',opts:['The top scorers','Those who lift others up','Those who never make mistakes','The most talented ones'],ans:1},
{q:'What does the passage say about opportunities?',opts:['They should be avoided','They only come to top students','You should take them when they appear','They are not important'],ans:2},
{q:'What is the main idea of the last paragraph?',opts:['Grades are the most important thing','High school is only about preparing for exams','Personal growth matters more than exam scores','Talent determines your future'],ans:2}];

let cg=1,ws={},a1={},a2={},s1=false,s2=false,ra={},rs=false;
const SK='vocab700_day5_v1';
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function ld(){try{return JSON.parse(localStorage.getItem(SK)||'{}');}catch(e){return{};}}
function sd(d){localStorage.setItem(SK,JSON.stringify(d));}
function speak(w){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.78;speechSynthesis.speak(u);}}
function up(){let d=0;if(Object.keys(ws).length>=10)d++;if(s1&&s2)d=Math.max(d,2);if(rs)d=Math.max(d,3);if(d>=3&&s1&&s2&&rs)d=4;const p=d/4*100;document.getElementById('progBar').style.width=p+'%';document.getElementById('progText').textContent=d+'/4';if(d===4){document.getElementById('progBar').style.background='#10B981';document.getElementById('progText').style.color='#10B981';}else{document.getElementById('progBar').style.background='var(--primary)';document.getElementById('progText').style.color='var(--primary)';}}
function cur(){return s1&&s2;}
function sw(g){cg=g;document.querySelectorAll('.group-tab').forEach((t,i)=>t.classList.toggle('active',i===g-1));document.getElementById('wqGroupLabel').textContent=g===1?'第一组':'第二组';rwl();rwq();uwq();}
function uwq(){const sb=cg===1?s1:s2;document.getElementById('wordQuizSubmit').style.display=sb?'none':'block';document.getElementById('wordQuizRetry').style.display=sb?'block':'none';document.getElementById('wordQuizFB').textContent=sb?'该组已提交，可重新练习':'';}
function rwl(){const ids=cg===1?g1:g2;let h='';ids.forEach(id=>{const w=wordsData[id],st=ws[id];let t='';if(w.meanings.length>1)t+='<span class="tag-multi">+'+(w.meanings.length-1)+'义</span>';if(st==='know')t+='<span class="tag-status know">✅</span>';else if(st==='unsure')t+='<span class="tag-status unsure">🤔</span>';else if(st==='dunno')t+='<span class="tag-status dunno">❌</span>';h+=`<div class="word-card" onclick="od(${id})"><div class="card-sentence">${w.sentence}</div><div class="card-info"><span class="card-word-en">${w.en}</span><span class="card-word-zh">${w.zh}</span><span class="card-tags">${t}</span><button class="speak-btn" onclick="event.stopPropagation();speak('${w.en.replace(/'/g,"\\'")}')">🔊</button></div></div>`;});document.getElementById('wordList').innerHTML=h;}
function od(id){const w=wordsData[id],st=ws[id];let m='';w.meanings.forEach((x,i)=>{m+=`<div class="meaning-block"><div class="meaning-num">义项 ${i+1}</div><div class="meaning-zh">${x.zh}</div><div class="meaning-ex">${x.ex}</div></div>`;});document.getElementById('detailCard').innerHTML=`<div class="d-word">${w.en}</div><div class="d-pron" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊 点击听发音</div>${m}<div class="status-row"><button class="status-btn know-btn ${st==='know'?'selected':''}" onclick="ms(${id},'know')">✅ 认识</button><button class="status-btn unsure-btn ${st==='unsure'?'selected':''}" onclick="ms(${id},'unsure')">🤔 模糊</button><button class="status-btn dunno-btn ${st==='dunno'?'selected':''}" onclick="ms(${id},'dunno')">❌ 不认识</button></div><button class="close-detail-btn" onclick="cd()">关闭</button>`;document.getElementById('detailOverlay').classList.add('show');speak(w.en);}
function cd(){document.getElementById('detailOverlay').classList.remove('show');}
function ms(id,s){ws[id]=s;rwl();od(id);toast({know:'已标记：认识 ✅',unsure:'已标记：模糊 🤔',dunno:'已标记：不认识 ❌'}[s]);up();sd({...ld(),wordStatuses:ws});}
function rwq(){const qd=wq[cg],ans=cg===1?a1:a2,sb=cg===1?s1:s2;let h='';qd.forEach((q,qi)=>{h+=`<div class="wq-item"><div class="wq-q">${qi+1}. ${q.q}</div><div class="wq-opts">`;q.opts.forEach((o,oi)=>{const pk=ans[qi]===oi,cr=sb&&q.ans===oi,wr=sb&&ans[qi]===oi&&oi!==q.ans;let cl='';if(pk&&!sb)cl='picked';if(cr)cl='correct';if(wr)cl='wrong';h+=`<button class="wq-opt ${cl}" id="wq_${qi}_${oi}" onclick="pw(${qi},${oi})" ${sb?'disabled':''}>${o}</button>`;});h+=`</div></div>`;});document.getElementById('wordQuizArea').innerHTML=h;}
function pw(qi,oi){const sb=cg===1?s1:s2;if(sb)return;const ans=cg===1?a1:a2;for(let i=0;i<4;i++){const b=document.getElementById('wq_'+qi+'_'+i);if(b)b.classList.remove('picked');}const b=document.getElementById('wq_'+qi+'_'+oi);if(b)b.classList.add('picked');ans[qi]=oi;if(cg===1)a1=ans;else a2=ans;}
function swq(){const sb=cg===1?s1:s2;if(sb)return;const qd=wq[cg],ans=cg===1?a1:a2;let c=0;qd.forEach((q,qi)=>{const pk=ans[qi];for(let i=0;i<4;i++){const b=document.getElementById('wq_'+qi+'_'+i);if(!b)continue;b.disabled=true;b.classList.remove('picked');if(i===q.ans)b.classList.add('correct');if(i===pk&&i!==q.ans)b.classList.add('wrong');}if(pk===q.ans)c++;});const p=Math.round(c/10*100),fb=document.getElementById('wordQuizFB');fb.textContent=`词义选择：${c}/10 (${p}%)`;fb.style.color=p>=80?'#10B981':'#EF4444';if(cg===1)s1=true;else s2=true;uwq();up();if(cur()){document.getElementById('readingQuizSubmit').disabled=false;document.getElementById('readingQuizSubmit').textContent='📋 提交阅读理解';toast('两组词义选择完成！可以挑战阅读理解 🎉');}else toast('请继续完成'+(cg===1?'第二组':'第一组')+'的词义选择');sd({...ld(),['ws'+cg]:p,['s'+cg]:true,['a'+cg]:ans});}
function rwqr(){if(cg===1){s1=false;a1={};}else{s2=false;a2={};}uwq();rwq();up();document.getElementById('wordQuizFB').textContent='';document.getElementById('readingQuizSubmit').disabled=true;document.getElementById('readingQuizSubmit').textContent='🔒 先完成两组词义选择';if(rs){rs=false;ra={};urq();rrq();document.getElementById('readingQuizFB').textContent='';}sd({...ld(),s1,s2,a1,a2,readingSubmitted:rs,readingAnswers:ra});toast('词义选择已重置 🔄');}
function rpr(){document.getElementById('passageText').innerHTML=psg;rrq();}
function rrq(){let h='';rq.forEach((q,qi)=>{h+=`<div class="reading-quiz-item"><div class="rq-q">${qi+1}. ${q.q}</div><div class="rq-opts">`;q.opts.forEach((o,oi)=>{const pk=ra[qi]===oi,cr=rs&&q.ans===oi,wr=rs&&ra[qi]===oi&&oi!==q.ans;let cl='';if(pk&&!rs)cl='picked';if(cr)cl='correct';if(wr)cl='wrong';h+=`<button class="rq-opt ${cl}" id="rq_${qi}_${oi}" onclick="pr(${qi},${oi})" ${rs?'disabled':''}>${o}</button>`;});h+=`</div></div>`;});document.getElementById('readingQuizArea').innerHTML=h;}
function urq(){document.getElementById('readingQuizSubmit').style.display=rs?'none':'block';document.getElementById('readingQuizRetry').style.display=rs?'block':'none';}
function pr(qi,oi){if(rs||document.getElementById('readingQuizSubmit').disabled)return;for(let i=0;i<4;i++){const b=document.getElementById('rq_'+qi+'_'+i);if(b)b.classList.remove('picked');}const b=document.getElementById('rq_'+qi+'_'+oi);if(b)b.classList.add('picked');ra[qi]=oi;}
function srq(){if(rs||document.getElementById('readingQuizSubmit').disabled)return;let c=0;rq.forEach((q,qi)=>{const pk=ra[qi];for(let i=0;i<4;i++){const b=document.getElementById('rq_'+qi+'_'+i);if(!b)continue;b.disabled=true;b.classList.remove('picked');if(i===q.ans)b.classList.add('correct');if(i===pk&&i!==q.ans)b.classList.add('wrong');}if(pk===q.ans)c++;});const p=Math.round(c/5*100),fb=document.getElementById('readingQuizFB');fb.textContent=`阅读理解：${c}/5 (${p}%)`;fb.style.color=p>=80?'#10B981':'#EF4444';rs=true;urq();up();document.getElementById('scoreEmoji').textContent=p>=80?'🎉':'💪';document.getElementById('scoreNum').textContent=c+'/5';document.getElementById('scoreLabel').textContent=p>=80?'恭喜通关 Day 5！':'继续加油！';document.getElementById('scoreDetail').textContent=p>=80?'20个核心词 + 短文阅读，全部完成 ✅\n校园主题圆满完成！':'建议复习短文和单词后再试一次';document.getElementById('scoreOverlay').classList.add('show');sd({...ld(),readingScore:p,readingSubmitted:true,readingAnswers:ra,completed:p>=80});}
function rrqr(){rs=false;ra={};urq();rrq();up();document.getElementById('readingQuizFB').textContent='';sd({...ld(),readingSubmitted:rs,readingAnswers:ra,completed:false});toast('阅读理解已重置 🔄');}
function cs(){document.getElementById('scoreOverlay').classList.remove('show');}
function rao(){if(confirm('确定要重置本日全部进度吗？')){ws={};a1={};a2={};s1=false;s2=false;ra={};rs=false;localStorage.removeItem(SK);cg=1;document.querySelectorAll('.group-tab').forEach((t,i)=>t.classList.toggle('active',i===0));document.getElementById('wqGroupLabel').textContent='第一组';document.getElementById('wordQuizSubmit').style.display='block';document.getElementById('wordQuizRetry').style.display='none';document.getElementById('wordQuizFB').textContent='';document.getElementById('readingQuizSubmit').disabled=true;document.getElementById('readingQuizSubmit').textContent='🔒 先完成两组词义选择';document.getElementById('readingQuizSubmit').style.display='block';document.getElementById('readingQuizRetry').style.display='none';document.getElementById('readingQuizFB').textContent='';document.getElementById('progBar').style.background='var(--primary)';document.getElementById('progText').style.color='var(--primary)';rwl();rwq();rpr();up();toast('已重置本日全部进度 🗑️');}}
function init(){const d=ld();if(d.wordStatuses)ws=d.wordStatuses;if(d.s1!==undefined)s1=d.s1;if(d.s2!==undefined)s2=d.s2;if(d.readingSubmitted!==undefined)rs=d.readingSubmitted;if(d.a1)a1=d.a1;if(d.a2)a2=d.a2;if(d.readingAnswers)ra=d.readingAnswers;rwl();rwq();rpr();up();uwq();urq();if(cur()&&!rs){document.getElementById('readingQuizSubmit').disabled=false;document.getElementById('readingQuizSubmit').textContent='📋 提交阅读理解';}}
document.getElementById('detailOverlay').addEventListener('click',function(e){if(e.target===this)cd();});
document.getElementById('scoreOverlay').addEventListener('click',function(e){if(e.target===this)cs();});
init();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中英语500核心词 · 40天攻克计划</title>
    <style>
        :root {
            --primary: #4A6CF7;
            --primary-light: #EEF1FE;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg: #F0F2F8;
            --card: #FFFFFF;
            --text: #1E293B;
            --text-secondary: #64748B;
            --border: #E2E8F0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 40px;
        }

        /* ========== 头部 ========== */
        .header {
            text-align: center;
            padding: 20px 0 12px;
        }
        .header .icon { font-size: 48px; margin-bottom: 8px; }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
        .header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        /* ========== 进度环 ========== */
        .progress-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 16px 0;
            background: var(--card);
            border-radius: var(--radius);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .progress-ring {
            position: relative;
            width: 90px;
            height: 90px;
        }
        .progress-ring svg {
            transform: rotate(-90deg);
            width: 90px;
            height: 90px;
        }
        .progress-ring .bg-circle {
            fill: none;
            stroke: var(--border);
            stroke-width: 6;
        }
        .progress-ring .fg-circle {
            fill: none;
            stroke: var(--primary);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease;
        }
        .progress-ring .inner-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .progress-ring .percent {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        .progress-ring .label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .progress-stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-stats .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .stat .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot.blue { background: var(--primary); }
        .dot.green { background: var(--success); }
        .dot.orange { background: var(--warning); }

        /* ========== 主题标签 ========== */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 8px 0 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title .emoji { font-size: 18px; }
        .theme-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .theme-tag {
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .theme-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .theme-tag:active {
            transform: scale(0.96);
        }

        /* ========== 天数网格 ========== */
        .day-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .day-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            text-decoration: none;
            color: var(--text);
        }
        .day-card:active {
            transform: scale(0.96);
            background: var(--primary-light);
        }
        .day-card .day-num {
            font-size: 18px;
            font-weight: 700;
        }
        .day-card .day-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .day-card.completed {
            background: #F0FDF6;
            border-color: var(--success);
        }
        .day-card.completed::after {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 12px;
            color: var(--success);
            font-weight: 700;
        }
        .day-card.current {
            background: var(--primary-light);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74,108,247,0.12);
        }
        .day-card.locked {
            opacity: 0.4;
            pointer-events: none;
        }

        /* ========== 底部信息 ========== */
        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94A3B8;
            line-height: 1.8;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="icon">📚</div>
            <h1>高中英语500核心词</h1>
            <div class="subtitle">40天攻克计划 · 主题场景记忆法 · 准高考难度</div>
        </div>

        <!-- 进度总览 -->
        <div class="progress-section">
            <div class="progress-ring">
                <svg viewBox="0 0 90 90">
                    <circle class="bg-circle" cx="45" cy="45" r="38"/>
                    <circle class="fg-circle" id="mainProgressCircle" cx="45" cy="45" r="38"
                    stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
                </svg>
                <div class="inner-text">
                    <span class="percent" id="mainPercent">0%</span>
                    <span class="label">总进度</span>
                </div>
            </div>
            <div class="progress-stats">
                <div class="stat"><span class="dot blue"></span> 总词汇：<strong>500</strong></div>
                <div class="stat"><span class="dot green"></span> 已掌握：<strong id="statMastered">0</strong></div>
                <div class="stat"><span class="dot orange"></span> 学习中：<strong id="statLearning">500</strong></div>
            </div>
        </div>

        <!-- 主题标签 -->
        <div class="section-title"><span class="emoji">🎯</span> 学习主题</div>
        <div class="theme-tags">
            <span class="theme-tag active" onclick="filterDays('all', this)">全部</span>
            <span class="theme-tag" onclick="filterDays('school', this)">🏫 校园学习</span>
            <span class="theme-tag" onclick="filterDays('family', this)">👨‍👩‍👧 家庭人际</span>
            <span class="theme-tag" onclick="filterDays('emotion', this)">💭 情绪思想</span>
            <span class="theme-tag" onclick="filterDays('society', this)">🌍 社会事件</span>
            <span class="theme-tag" onclick="filterDays('tech', this)">🔬 科技自然</span>
            <span class="theme-tag" onclick="filterDays('health', this)">💪 健康生活</span>
            <span class="theme-tag" onclick="filterDays('abstract', this)">🧠 抽象概念</span>
        </div>

        <!-- 40天网格 -->
        <div class="section-title"><span class="emoji">📅</span> 学习日历</div>
        <div class="day-grid" id="dayGrid"></div>

        <!-- 底部 -->
        <div class="footer-info">
            💡 点击天数开始学习 · 进度自动保存到本地<br>
            建议每日完成20词 + 词义选择 + 短文阅读
        </div>
    </div>

    <script>
        // ==================== 主题映射 ====================
        const dayThemes = {};
        const themeRanges = [
            { theme: 'school', start: 1, end: 5 },
            { theme: 'school', start: 6, end: 6, isReview: true },
            { theme: 'family', start: 7, end: 11 },
            { theme: 'family', start: 12, end: 12, isReview: true },
            { theme: 'emotion', start: 13, end: 17 },
            { theme: 'emotion', start: 18, end: 18, isReview: true },
            { theme: 'society', start: 19, end: 23 },
            { theme: 'society', start: 24, end: 24, isReview: true },
            { theme: 'tech', start: 25, end: 29 },
            { theme: 'tech', start: 30, end: 30, isReview: true },
            { theme: 'health', start: 31, end: 35 },
            { theme: 'health', start: 36, end: 36, isReview: true },
            { theme: 'abstract', start: 37, end: 39 },
            { theme: 'abstract', start: 40, end: 40, isReview: true },
        ];

        themeRanges.forEach(tr => {
            for (let d = tr.start; d <= tr.end; d++) {
                dayThemes[d] = { theme: tr.theme, isReview: tr.isReview || false };
            }
        });

        // ==================== 进度管理 ====================
        function loadAllProgress() {
            try {
                return JSON.parse(localStorage.getItem('vocab600_index_progress') || '{}');
            } catch (e) { return {}; }
        }

        function saveAllProgress(data) {
            localStorage.setItem('vocab600_index_progress', JSON.stringify(data));
        }

        // 也检查各天独立存储的完成状态
        function isDayCompleted(dayNum) {
            // 先检查索引级进度
            const idxProgress = loadAllProgress();
            if (idxProgress['day' + dayNum] && idxProgress['day' + dayNum].completed) return true;

            // 再检查各天独立存储
            try {
                const dayData = JSON.parse(localStorage.getItem('vocab600_day' + dayNum + '_v3') || '{}');
                if (dayData.completed) return true;
            } catch (e) {}

            return false;
        }

        // ==================== 渲染 ====================
        function renderDayGrid() {
            const grid = document.getElementById('dayGrid');
            let html = '';
            for (let d = 1; d <= 40; d++) {
                const themeInfo = dayThemes[d] || { theme: '', isReview: false };
                const isReview = themeInfo.isReview;
                const completed = isDayCompleted(d);

                let cls = '';
                if (completed) cls = 'completed';
                else if (d === 1) cls = 'current';
                else if (d > 1 && !completed) cls = 'locked';

                // 解锁逻辑：前一天完成或复习日自动解锁
                if (d > 1 && !completed && isDayCompleted(d - 1)) cls = '';
                if (isReview && !completed) {
                    // 复习日：如果前5天全部完成则解锁
                    const prevStart = d - 5;
                    let allPrevDone = true;
                    for (let pd = prevStart; pd < d; pd++) {
                        if (!isDayCompleted(pd)) { allPrevDone = false; break; }
                    }
                    if (allPrevDone) cls = '';
                }

                const label = isReview ? '📝复习' : ('Day ' + d);
                html += `
                <div class="day-card ${cls}" onclick="openDay(${d})">
                  <div class="day-num">${isReview ? '📝' : d}</div>
                  <div class="day-label">${label}</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function updateMainProgress() {
            let completedDays = 0;
            for (let d = 1; d <= 40; d++) {
                if (isDayCompleted(d)) completedDays++;
            }

            const pct = Math.round((completedDays / 40) * 100);
            document.getElementById('mainPercent').textContent = pct + '%';
            document.getElementById('statMastered').textContent = completedDays * 12 +
            '词'; // 约每天12.5个词
            document.getElementById('statLearning').textContent = (500 - completedDays * 12) + '词';

            const circle = document.getElementById('mainProgressCircle');
            const circumference = 238.76;
            const offset = circumference - (pct / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function filterDays(theme, el) {
            document.querySelectorAll('.theme-tag').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            const cards = document.querySelectorAll('.day-card');
            cards.forEach((card, i) => {
                const d = i + 1;
                if (theme === 'all') {
                    card.style.display = '';
                } else {
                    const info = dayThemes[d];
                    card.style.display = (info && info.theme === theme) ? '' : 'none';
                }
            });
        }

        function openDay(dayNum) {
            if (dayNum === 1) {
                // 跳转到第1天页面
                window.location.href = 'day1.html';
            } else {
                showToast('Day ' + dayNum + ' 内容即将上线，敬请期待！');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 1800);
        }

        // ==================== 初始化 ====================
        function init() {
            renderDayGrid();
            updateMainProgress();
        }

        init();
    </script>
</body>
</html>
